name: CalHarness CI & Epistemic Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test & Epistemic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Remote Specialist Snapshot Integrity Check
        run: |
          python ecu-kb/remote_bridge.py check

      - name: 2. Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: 3. Engineering Documentation Strict A2L & Epistemic Lint
        run: |
          python tools/kb_a2l_doc_linter.py docs/tuning/stage1_bls_edc16u34_master_guide.md --strict
