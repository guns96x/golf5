name: Нагадайка (Android APK)

on:
  push:
    paths:
      - "reminder-app/**"
      - ".github/workflows/reminder-app.yml"
  workflow_dispatch:

# Реліз на GitHub — звідти застосунок бере оновлення (кнопка «Перевірити оновлення»).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Тести
        run: ./gradlew testDebugUnitTest

      - name: Ключ підпису (якщо задано в Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.NAHADAIKA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NAHADAIKA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::NAHADAIKA_KEYSTORE_BASE64 не задано — APK буде підписано тимчасовим ключем, оновлення поверх не встановиться."
          fi

      - name: Збірка APK
        env:
          NAHADAIKA_KEYSTORE_PASSWORD: ${{ secrets.NAHADAIKA_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: nahadaika-apk
          path: reminder-app/app/build/outputs/apk/release/app-release.apk

      - name: Реліз для оновлення в застосунку (APK + патч від попередньої версії)
        if: env.NAHADAIKA_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet bsdiff4
          bash tools/release.sh
